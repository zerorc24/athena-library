{% extends 'library/base.html' %}

{% block title %}Register | Athena Library{% endblock %}

{% block content %}
<section class="min-h-[calc(100vh-160px)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg border border-gray-100 p-8">
    
    <!-- Header Icon & Title -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
        👤
      </div>
      <h2 class="text-2xl font-bold text-gray-900">Create your account</h2>
      <p class="text-sm text-gray-500 mt-1">Join Athena Library to borrow and manage books</p>
    </div>

    <!-- Registration Form -->
    <form method="POST" action="{% url 'register' %}" class="space-y-5">
      {% csrf_token %}

      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input 
          type="text" 
          id="username"
          name="username" 
          placeholder="e.g. alex_reader" 
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-transparent transition bg-gray-50 focus:bg-white text-gray-900" 
          required 
          autocomplete="username"
        >
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input 
          type="email" 
          id="email"
          name="email" 
          placeholder="name@example.com" 
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-transparent transition bg-gray-50 focus:bg-white text-gray-900" 
          required 
          autocomplete="email"
        >
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input 
          type="password" 
          id="password"
          name="password" 
          placeholder="••••••••" 
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-transparent transition bg-gray-50 focus:bg-white text-gray-900" 
          required 
          autocomplete="new-password"
        >
      </div>

      <button 
        type="submit" 
        class="w-full bg-green-600 text-white py-3 px-4 rounded-lg font-semibold hover:bg-green-500 transition duration-200 shadow-md hover:shadow-lg"
      >
        Create Profile
      </button>

      <p class="text-center text-sm text-gray-600 mt-6">
        Already registered? 
        <a href="{% url 'login' %}" class="text-green-600 font-semibold hover:underline">Sign In</a>
      </p>
    </form>

  </div>
</section>
{% endblock %}
