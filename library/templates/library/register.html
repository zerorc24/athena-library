{% extends 'library/base.html' %}

{% block title %}Athena Libraries | Register{% endblock %}

{% block content %}
<style>
  .hud-wrapper {
    min-height: calc(100vh - 160px);
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #0f172a, #020617);
    padding: 2rem 1rem;
  }

  .hud-frame {
    width: 100%;
    max-width: 400px;
    padding: 36px 28px;
    position: relative;
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(99, 102, 241, 0.4);
    border-radius: 16px;
    box-shadow: 0 0 30px rgba(34, 197, 94, 0.2), inset 0 0 25px rgba(34, 197, 94, 0.1);
  }

  /* HUD Corner Accents */
  .hud-frame::before,
  .hud-frame::after {
    content: "";
    position: absolute;
    width: 24px;
    height: 24px;
    border: 2px solid #6366f1;
    pointer-events: none;
  }

  .hud-frame::before {
    top: -6px;
    left: -6px;
    border-right: none;
    border-bottom: none;
  }

  .hud-frame::after {
    bottom: -6px;
    right: -6px;
    border-left: none;
    border-top: none;
  }

  .avatar {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: radial-gradient(circle, #22c55e, #1e1b4b);
    box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 1.5rem;
  }

  .hud-input {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 14px;
    background: rgba(2, 6, 23, 0.5);
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 8px;
    color: #f3f4f6;
    outline: none;
    transition: all 0.3s ease;
  }

  .hud-input:focus {
    border-color: #22c55e;
    box-shadow: 0 0 10px rgba(34, 197, 94, 0.3);
  }

  .hud-input::placeholder {
    color: #94a3b8;
  }

  .hud-btn {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.25), rgba(99, 102, 241, 0.2));
    border: 1px solid #22c55e;
    color: #4ade80;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: 1px;
    transition: all 0.3s ease;
  }

  .hud-btn:hover {
    background: #22c55e;
    color: #020617;
    box-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
  }
</style>

<div class="hud-wrapper">
  <div class="hud-frame">
    <div class="avatar">👤</div>
    <h3 class="text-center text-xl font-bold text-gray-100 mb-6 tracking-wide">REGISTER IDENT</h3>

    <form method="POST" action="{% url 'register' %}">
      {% csrf_token %}

      <input 
        type="text" 
        name="username" 
        placeholder="Username" 
        class="hud-input" 
        required 
        autocomplete="username"
      >

      <input 
        type="email" 
        name="email" 
        placeholder="Email Address" 
        class="hud-input" 
        required 
        autocomplete="email"
      >
      
      <input 
        type="password" 
        name="password" 
        placeholder="Password" 
        class="hud-input" 
        required 
        autocomplete="new-password"
      >

      <button type="submit" class="hud-btn">CREATE PROFILE</button>

      <p class="text-center text-xs text-gray-400 mt-6">
        Already registered? 
        <a href="{% url 'login' %}" class="text-indigo-400 font-semibold hover:underline">Sign In</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
