{% extends 'library/base.html' %}
{% block title %}Dashboard | Athena Library{% endblock %}

{% block content %}
<section class="max-w-7xl mx-auto px-6 py-12">
  <h2 class="text-3xl font-bold text-green-600 mb-8">Welcome, {{ user.username }}</h2>

  <!-- Quick Stats -->
  <div class="grid md:grid-cols-3 gap-6 mb-12">
    <div class="bg-green-50 p-6 rounded-lg shadow">
      <h3 class="text-xl font-semibold text-green-700">Borrowed Books</h3>
      <p class="text-2xl font-bold">{{ borrowed_count }}</p>
    </div>
    <div class="bg-green-50 p-6 rounded-lg shadow">
      <h3 class="text-xl font-semibold text-green-700">Due Soon</h3>
      <p class="text-2xl font-bold">{{ due_soon_count }}</p>
    </div>
    <div class="bg-green-50 p-6 rounded-lg shadow">
      <h3 class="text-xl font-semibold text-green-700">Returned</h3>
      <p class="text-2xl font-bold">{{ returned_count }}</p>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="grid md:grid-cols-2 gap-6">
    <a href="{% url 'library' %}" class="bg-green-600 text-white p-6 rounded-lg shadow hover:bg-green-500 transition text-center font-semibold">
      Browse Library
    </a>
    <a href="{% url 'my_books' %}" class="bg-gray-100 text-green-700 p-6 rounded-lg shadow hover:bg-gray-200 transition text-center font-semibold">
      My Borrowed Books
    </a>
  </div>
</section>
{% endblock %}
