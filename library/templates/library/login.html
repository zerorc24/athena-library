{% extends 'library/base.html' %}

{% block title %}Login | Athena Library{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-160px)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
    
    <div class="text-center">
      <div class="mx-auto h-16 w-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-2xl font-bold mb-3 shadow-inner">
        📚
      </div>
      <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">
        Welcome Back
      </h2>
      <p class="mt-2 text-sm text-gray-600">
        Sign in to manage your library account and borrowed books.
      </p>
    </div>

    <form class="mt-8 space-y-6" action="{% url 'login' %}" method="POST">
      {% csrf_token %}
      
      <div class="rounded-md space-y-4">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
            Username
          </label>
          <input 
            id="username" 
            name="username" 
            type="text" 
            required 
            class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm transition" 
            placeholder="Enter your username"
            autocomplete="username"
          >
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
            Password
          </label>
          <input 
            id="password" 
            name="password" 
            type="password" 
            required 
            class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-400 text-gray-900 focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 text-sm transition" 
            placeholder="••••••••"
            autocomplete="current-password"
          >
        </div>
      </div>

      <div class="flex items-center justify-between text-sm">
        <div class="flex items-center">
          <input 
            id="remember-me" 
            name="remember-me" 
            type="checkbox" 
            class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300 rounded"
          >
          <label for="remember-me" class="ml-2 block text-sm text-gray-700">
            Remember me
          </label>
        </div>

        <div class="text-sm">
          <a href="#" class="font-medium text-green-600 hover:text-green-500 transition">
            Forgot password?
          </a>
        </div>
      </div>

      <div>
        <button 
          type="submit" 
          class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-lg text-white bg-green-600 hover:bg-green-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-150 shadow-md"
        >
          Sign In
        </button>
      </div>
    </form>

    <div class="text-center pt-2 border-t border-gray-100">
      <p class="text-sm text-gray-600">
        Don't have an account? 
        <a href="{% url 'register' %}" class="font-semibold text-green-600 hover:text-green-500 transition">
          Create an account
        </a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
